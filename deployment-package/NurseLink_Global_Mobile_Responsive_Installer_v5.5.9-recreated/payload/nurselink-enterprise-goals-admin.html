<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NurseLink Enterprise Goal Management</title><link rel="stylesheet" href="/nurselink-admin-portal.css"><link rel="stylesheet" href="/nurselink-enterprise-goals-admin.css"></head><body class="nl-admin-body"><div class="nl-admin-shell"><aside class="nl-admin-sidebar"><div class="nl-admin-sidebar-brand"><div class="nl-admin-brand-mark">NL</div><div><strong>NurseLink</strong><small>Administrator Portal</small></div></div><nav><a href="/nurselink-admin-dashboard.html">Dashboard</a><a href="/nurselink-enterprise-command-center.html">Enterprise Platform</a><a class="active" href="/nurselink-enterprise-goals-admin.html">Enterprise Goals</a><a href="/nurselink-institutional-analytics.html">Institutional Analytics</a></nav><button id="adminSignOut" type="button">Sign out of Admin Portal</button></aside><main class="nl-admin-main ega-main"><header class="nl-admin-header"><div><span class="nl-admin-eyebrow">ENTERPRISE GOALS</span><h1>Cohort Goal & Progress Management</h1><p>Create measurable NurseLink coordination goals and manage member progress.</p></div><div id="adminIdentity" class="nl-admin-identity">Checking administrator session…</div></header><div id="goalAdminNotice" class="nl-admin-notice" hidden></div><section class="ega-grid"><section class="ega-panel"><h2>Select cohort</h2><select id="goalCohort"></select><form id="goalForm"><input id="goalId" type="hidden"><label><span>Title</span><input id="goalTitle" required maxlength="190"></label><label><span>Type</span><select id="goalType"><option value="participation">Participation</option><option value="learning">Learning</option><option value="engagement">Engagement</option><option value="readiness">Readiness</option><option value="custom">Custom</option></select></label><label><span>Target value</span><input id="goalTargetValue" type="number" min="0" step="0.01"></label><label><span>Target unit</span><input id="goalTargetUnit" maxlength="80"></label><label><span>Status</span><select id="goalStatus"><option value="planned">Planned</option><option value="active">Active</option><option value="completed">Completed</option><option value="archived">Archived</option></select></label><label><span>Visibility</span><select id="goalVisibility"><option value="members_and_partners">Members + Partners</option><option value="members_only">Members Only</option><option value="admin_only">Admin Only</option></select></label><label><span>Due</span><input id="goalDue" type="datetime-local"></label><label><span>Description</span><textarea id="goalDescription" rows="4" maxlength="10000"></textarea></label><div><button id="clearGoal" type="button">Clear</button><button type="submit">Save Goal</button></div></form></section><section class="ega-panel"><h2>Goals</h2><div id="goalList" class="ega-list"></div></section></section><section id="goalProgressPanel" class="ega-panel" hidden><div class="ega-head"><h2 id="goalProgressTitle">Goal progress</h2><button id="closeGoalProgress" type="button">Close</button></div><div id="goalProgressList" class="ega-list"></div></section></main></div><script src="/nurselink-enterprise-goals-admin.js" defer></script></body></html>
